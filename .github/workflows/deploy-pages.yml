name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # Painel macro: atualiza os dados do Banco Central em dias úteis, de manhã (CDI do dia anterior)
    # e à noite (PTAX do dia). Horários em UTC: 08:13 e 19:13 em Brasília.
    - cron: "13 11,22 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build project cards
        run: python scripts/build_projects.py

      - name: Fetch macro data
        run: python scripts/fetch_macro.py

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
